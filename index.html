<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom Vilha Mexicano — Cardápio Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600;1,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--bg:#15110d;--surface:#1d1712;--text:#f3ead4;--muted:#c3b6a1;--border:#2b2119;
    --chili:#dd5b31;--avocado:#d9a94a;--marigold:#e0b563;--clay:#8a6a4a;--agave:#6b5847;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .fd{font-family:'Playfair Display',serif}
  .mono{font-family:'Space Mono',monospace}
  .eyebrow{font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;font-weight:700;color:var(--chili)}
  ::-webkit-scrollbar{height:6px;width:6px}
  .catbtn.active{background:var(--chili);color:#fff;border-color:var(--chili)}
  .drawer{transition:transform .3s ease}
  .modalbg{transition:opacity .2s ease}
  input,select,textarea{background:var(--surface);color:var(--text);border-color:var(--border)}
  input::placeholder,textarea::placeholder{color:var(--muted)}
  .err{border-color:var(--chili)!important}
  .emo{font-size:22px;padding:4px 8px;border-radius:10px;border:2px solid var(--border);cursor:pointer;background:var(--surface)}
  .emo.sel{border-color:var(--chili);background:color-mix(in srgb, var(--chili) 12%, var(--surface))}
  .adtab{font-family:'Space Mono',monospace;font-size:11px}
</style>
</head>
<body>
<div id="app">

<div id="announcementBar" class="hidden text-center text-sm font-semibold px-4 py-2" style="background:var(--chili);color:#fff"></div>

<header class="sticky top-0 z-30 bg-[var(--bg)]/95 backdrop-blur border-b border-[var(--border)]">
  <div class="max-w-5xl mx-auto flex items-center justify-between px-4 py-3">
    <div id="brandName" class="fd font-extrabold text-xl leading-none"></div>
    <div class="flex items-center gap-2">
      <button id="adminBtn" onclick="openAdmin()" class="hidden rounded-full px-3 py-2 text-sm font-semibold border border-[var(--border)]">🔧 Admin</button>
      <button onclick="openCart()" class="relative flex items-center gap-2 rounded-full px-4 py-2 font-semibold text-sm" style="background:var(--chili);color:#fff">
        🛒 Carrinho
        <span id="cartBadge" class="hidden absolute -top-2 -right-2 text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center" style="background:var(--marigold);color:var(--bg)">0</span>
      </button>
    </div>
  </div>
  <div id="marqueeBar" class="mono text-[11px] tracking-widest overflow-x-auto whitespace-nowrap px-4 pb-2" style="color:var(--muted)"></div>
</header>

<section class="max-w-5xl mx-auto px-4 pt-8 pb-4 grid sm:grid-cols-2 gap-8 items-center">
  <div>
    <div id="heroEyebrow" class="eyebrow mb-3"></div>
    <h1 id="heroTitle" class="fd font-extrabold text-4xl sm:text-5xl leading-[1.1]"></h1>
    <p id="heroParagraph" class="mt-4 text-sm sm:text-base" style="color:var(--muted)"></p>
    <div class="mt-4 space-y-1 text-sm" style="color:var(--muted)">
      <div id="heroBul1"></div>
      <div id="heroBul2"></div>
    </div>
    <div class="flex flex-wrap gap-3 mt-6">
      <a id="heroWhatsapp" href="#" target="_blank" class="rounded-full px-5 py-3 font-semibold text-sm flex items-center gap-2" style="background:var(--chili);color:#fff"><span id="heroWhatsappLabel"></span></a>
      <a href="#cardapio" id="heroMenuBtn" class="rounded-full px-5 py-3 font-semibold text-sm border" style="border-color:var(--border)"></a>
    </div>
  </div>
  <div class="rounded-xl p-5 shadow-lg" style="background:var(--text);color:var(--bg)">
    <div id="ticketBrand" class="mono text-[11px] tracking-widest" style="color:var(--chili)"></div>
    <div class="fd font-bold text-xl mt-1">Comanda do dia</div>
    <div class="mono text-[11px] mt-1" style="color:#7a6a55">CARDÁPIO ARTESANAL · Nº 01</div>
    <div id="heroTicket" class="mt-4 space-y-2 text-sm"></div>
  </div>
</section>

<nav id="cardapio" class="sticky top-[88px] sm:top-[92px] z-20 bg-[var(--bg)]/95 backdrop-blur border-b border-[var(--border)]">
  <div id="catNav" class="max-w-5xl mx-auto flex gap-2 px-4 py-3 overflow-x-auto"></div>
</nav>

<section class="max-w-5xl mx-auto px-4 pt-6">
  <div id="menuEyebrow" class="eyebrow mb-2"></div>
  <h2 id="menuTitle" class="fd font-extrabold text-2xl sm:text-3xl mb-6"></h2>
</section>

<main class="max-w-5xl mx-auto px-4 pb-6">
  <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>

<section class="max-w-5xl mx-auto px-4 py-10">
  <div id="featuresEyebrow" class="eyebrow mb-2"></div>
  <h2 id="featuresTitle" class="fd font-extrabold text-2xl sm:text-3xl mb-6"></h2>
  <div id="featuresGrid" class="grid sm:grid-cols-3 gap-4"></div>
</section>

<section class="text-center px-4 py-14" style="background:var(--surface)">
  <div id="ctaEyebrow" class="eyebrow mb-2"></div>
  <h2 id="ctaTitle" class="fd font-extrabold text-2xl sm:text-3xl"></h2>
  <p id="ctaParagraph" class="mt-2 text-sm" style="color:var(--muted)"></p>
  <a id="ctaWhatsapp" href="#" target="_blank" class="inline-block mt-6 rounded-full px-6 py-3 font-semibold" style="background:var(--chili);color:#fff"><span id="ctaWhatsappLabel2"></span></a>
</section>

<footer class="max-w-5xl mx-auto px-4 py-10 text-center text-xs" style="color:var(--muted)">
  <div id="footerBrand" class="fd font-bold text-base" style="color:var(--text)"></div>
  <div id="footerTagline" class="mt-1"></div>
  <div id="footerInfo" class="mt-2"></div>
</footer>

<button id="floatBar" onclick="openCart()" class="hidden fixed bottom-4 left-4 right-4 z-30 rounded-full py-3.5 px-5 text-white font-semibold shadow-lg flex items-center justify-between" style="background:var(--chili)">
  <span id="floatCount">0 itens</span>
  <span id="floatTotal">R$ 0,00</span>
</button>

<div id="modalBg" class="modalbg hidden fixed inset-0 z-40 bg-black/50 flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeModal()">
  <div class="bg-[var(--surface)] w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto">
    <div id="modalContent" class="p-5"></div>
  </div>
</div>

<div id="cartBg" class="modalbg hidden fixed inset-0 z-40 bg-black/50" onclick="if(event.target===this)closeCart()">
  <div id="cartDrawer" class="drawer fixed right-0 top-0 h-full w-full sm:w-[420px] bg-[var(--surface)] translate-x-full flex flex-col">
    <div class="flex items-center justify-between px-4 py-4 border-b border-[var(--border)]">
      <h2 id="drawerTitle" class="fd font-bold text-lg">Seu carrinho</h2>
      <button onclick="closeCart()" class="text-2xl leading-none px-2">&times;</button>
    </div>
    <div id="drawerBody" class="flex-1 overflow-y-auto p-4"></div>
  </div>
</div>

<div id="adminBg" class="modalbg hidden fixed inset-0 z-40 bg-black/50" onclick="if(event.target===this)closeAdmin()">
  <div id="adminDrawer" class="drawer fixed right-0 top-0 h-full w-full sm:w-[480px] bg-[var(--surface)] translate-x-full flex flex-col">
    <div class="flex items-center justify-between px-4 py-3 border-b border-[var(--border)]">
      <h2 class="fd font-bold text-lg">Painel administrativo</h2>
      <button onclick="closeAdmin()" class="text-2xl leading-none px-2">&times;</button>
    </div>
    <div id="adminTabs" class="flex gap-1.5 overflow-x-auto px-3 py-2 border-b border-[var(--border)]"></div>
    <div id="adminBody" class="flex-1 overflow-y-auto p-4"></div>
  </div>
</div>

<div id="toastEl" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 rounded-full px-5 py-2.5 text-sm font-semibold shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

</div>

a equilibrada e profundidade aromática.","price":11,"img":"🌶️","photo":null,"available":true,"badge":"","spec":"100g","addons":[]},{"id":"s5","cat":"salsas","name":"Cheddar Aveludado","desc":"Fusão cremosa e marcante de queijo cheddar com textura sedosa.","price":11,"img":"🧀","photo":null,"available":true,"badge":"","spec":"100g","addons":[]},{"id":"c1","cat":"combos","name":"Combo de Costela","desc":"1x Burrito de Costela (~370g), acompanhado de nachos artesanais, guacamole, molho de pimenta rústico e uma Coca-Cola mini.","price":60,"img":"🍽️","photo":null,"available":true,"badge":"Degustação especial","spec":"Combo completo","addons":[]},{"id":"c2","cat":"combos","name":"Combo Degustação de Molhos","desc":"Escolha 3 molhos (100g cada) e monte sua própria degustação.","price":28,"img":"🍽️","photo":null,"available":true,"badge":"","spec":"","addons":[]}]}</script>
<script>
const SELF_SRC = document.currentScript.textContent;
const HEAD_HTML = `<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom Vilha Mexicano — Cardápio Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600;1,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"><\/script>
<style>
  :root{--bg:#15110d;--surface:#1d1712;--text:#f3ead4;--muted:#c3b6a1;--border:#2b2119;
    --chili:#dd5b31;--avocado:#d9a94a;--marigold:#e0b563;--clay:#8a6a4a;--agave:#6b5847;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .fd{font-family:'Playfair Display',serif}
  .mono{font-family:'Space Mono',monospace}
  .eyebrow{font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;font-weight:700;color:var(--chili)}
  ::-webkit-scrollbar{height:6px;width:6px}
  .catbtn.active{background:var(--chili);color:#fff;border-color:var(--chili)}
  .drawer{transition:transform .3s ease}
  .modalbg{transition:opacity .2s ease}
  input,select,textarea{background:var(--surface);color:var(--text);border-color:var(--border)}
  input::placeholder,textarea::placeholder{color:var(--muted)}
  .err{border-color:var(--chili)!important}
  .emo{font-size:22px;padding:4px 8px;border-radius:10px;border:2px solid var(--border);cursor:pointer;background:var(--surface)}
  .emo.sel{border-color:var(--chili);background:color-mix(in srgb, var(--chili) 12%, var(--surface))}
  .adtab{font-family:'Space Mono',monospace;font-size:11px}
</style>
</head>`;

/* ===== Helpers ===== */
const brl = v => "R$ " + Number(v||0).toFixed(2).replace(".", ",");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rich(s){ return esc(s).replace(/\*(.+?)\*/g,'<em class="italic" style="color:var(--marigold)">$1</em>'); }

const EMOJI_OPTIONS = ["🌮","🌯","🥙","🥑","🥣","🍽️","🥤","🍺","🍹","🌶️","🧀","🍋","🥓","🍗"];
const ADDONS_BURRITO = [{n:"Guacamole extra",p:4},{n:"Queijo extra",p:3},{n:"Dose extra de molho",p:3}];
function getAddons(cat){ return cat==="burritos"?ADDONS_BURRITO:[]; }
function productAddons(p){ return Array.isArray(p.addons) ? p.addons : getAddons(p.cat); }

/* ===== Estado / dados persistidos ===== */
let SITE = JSON.parse(document.getElementById("siteData").textContent);
let MENU = SITE.products;
let CATEGORIES = SITE.categories;
if(!SITE.content.features) SITE.content.features = [];

let activeCat = CATEGORIES[0] ? CATEGORIES[0].id : "";
let cart = [];
let drawerView = "cart";
let order = {nome:"",telefone:"",tipo:"retirada",endereco:"",referencia:"",pagamento:"Pix",obs:""};
let isAdmin = false, artifactCap = null;

/* ===== Conteúdo dinâmico do site ===== */
function renderContent(){
  const c = SITE.content;
  document.getElementById("brandName").textContent = c.brandName;
  document.title = c.brandName + " — Cardápio Digital";
  document.getElementById("marqueeBar").innerHTML = esc(c.marqueeText).split("✦").map(s=>s.trim()).filter(Boolean).join(' <span style="color:var(--chili)">✦</span> ');
  document.getElementById("heroEyebrow").textContent = "— " + c.heroEyebrow;
  document.getElementById("heroTitle").innerHTML = rich(c.heroTitle);
  document.getElementById("heroParagraph").textContent = c.heroParagraph;
  document.getElementById("heroBul1").textContent = c.heroBulletsLine1;
  document.getElementById("heroBul2").textContent = c.heroBulletsLine2;
  document.getElementById("heroWhatsappLabel").textContent = "📲 " + c.ctaWhatsappLabel;
  document.getElementById("heroMenuBtn").textContent = c.ctaMenuLabel;
  document.getElementById("ticketBrand").textContent = c.brandName.toUpperCase();
  document.getElementById("menuEyebrow").textContent = c.menuEyebrow;
  document.getElementById("menuTitle").innerHTML = rich(c.menuTitle);
  document.getElementById("featuresEyebrow").textContent = c.featuresEyebrow;
  document.getElementById("featuresTitle").innerHTML = rich(c.featuresTitle);
  document.getElementById("featuresGrid").innerHTML = (c.features||[]).map(f=>`
    <div class="rounded-xl border p-4" style="border-color:var(--border)"><div class="text-2xl mb-2">${esc(f.icon)}</div><div class="fd font-bold mb-1">${esc(f.title)}</div><div class="text-sm" style="color:var(--muted)">${esc(f.desc)}</div></div>`).join("");
  document.getElementById("ctaEyebrow").textContent = c.ctaEyebrow;
  document.getElementById("ctaTitle").innerHTML = rich(c.ctaTitle);
  document.getElementById("ctaParagraph").textContent = c.ctaParagraph;
  document.getElementById("ctaWhatsappLabel2").textContent = "📲 " + c.ctaButtonLabel;
  document.getElementById("footerBrand").textContent = c.brandName;
  document.getElementById("footerTagline").textContent = c.footerTagline;
  document.getElementById("footerInfo").textContent = c.footerInfo;
  renderAnnouncement();
  renderTicket();
}
function renderAnnouncement(){
  const el = document.getElementById("announcementBar");
  const txt = (SITE.content.announcement||"").trim();
  if(txt){ el.textContent = "📣 " + txt; el.classList.remove("hidden"); } else { el.classList.add("hidden"); el.textContent=""; }
}
function renderTicket(){
  const el = document.getElementById("heroTicket"); if(!el) return;
  const picks=[], seen=new Set();
  for(const c of CATEGORIES){
    const item = MENU.find(p=>p.cat===c.id && p.available && !seen.has(p.id));
    if(item){ picks.push(item); seen.add(item.id); }
    if(picks.length>=4) break;
  }
  el.innerHTML = picks.length ? picks.map((p,i)=>`<div class="flex justify-between ${i<picks.length-1?'border-b border-dashed pb-1':''}" style="border-color:#00000022">${p.img} ${esc(p.name)} <span>${brl(p.price)}</span></div>`).join("")
    : '<div class="text-sm">Cardápio em breve...</div>';
}
function syncWhatsappLinks(){
  const url = `https://wa.me/${SITE.content.whatsappNumber}`;
  const a1=document.getElementById("heroWhatsapp"), a2=document.getElementById("ctaWhatsapp");
  if(a1) a1.href=url; if(a2) a2.href=url;
}

/* ===== Toast ===== */
function toast(msg, isError){
  const el = document.getElementById("toastEl");
  if(!el) return;
  el.textContent = (isError?"❌ ":"✅ ") + msg;
  el.style.background = isError ? "#c0392b" : "var(--avocado)";
  el.style.color = isError ? "#fff" : "var(--bg)";
  el.classList.remove("opacity-0","pointer-events-none");
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>{ el.classList.add("opacity-0","pointer-events-none"); }, 2800);
}

/* ===== Navegação / grade de produtos (cliente) ===== */
function navHTML(){
  return CATEGORIES.map(c=>`<button class="catbtn ${c.id===activeCat?'active':''} whitespace-nowrap rounded-full border border-[var(--border)] px-4 py-2 text-sm font-semibold" onclick="selectCat('${c.id}')">${c.icon} ${esc(c.name)}</button>`).join("");
}
function gridHTML(){
  const items = MENU.filter(p=>p.cat===activeCat);
  const cat = CATEGORIES.find(c=>c.id===activeCat);
  return items.map(p=>`
    <div class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] overflow-hidden flex flex-col ${p.available?'':'opacity-60'}">
      <div class="h-32 flex items-center justify-center text-5xl relative overflow-hidden" style="background:linear-gradient(135deg, color-mix(in srgb, ${cat?cat.color:'var(--chili)'} 18%, var(--surface)), color-mix(in srgb, ${cat?cat.color:'var(--chili)'} 42%, var(--surface)))">
        ${p.photo?`<img src="${p.photo}" class="w-full h-full object-cover">`:p.img}
        ${!p.available?'<span class="absolute top-2 right-2 text-[10px] font-bold px-2 py-1 rounded-full" style="background:var(--text);color:var(--surface)">ESGOTADO</span>':''}
      </div>
      <div class="p-4 flex flex-col flex-1">
        ${p.badge?`<span class="eyebrow mb-1" style="color:var(--marigold)">${esc(p.badge)}</span>`:''}
        <h3 class="fd font-bold text-base">${esc(p.name)}</h3>
        ${p.spec?`<div class="mono text-[11px] mt-0.5" style="color:var(--muted)">${esc(p.spec)}</div>`:''}
        <p class="text-sm text-[var(--muted)] mt-1 flex-1">${esc(p.desc)}</p>
        <div class="flex items-center justify-between mt-3">
          <span class="font-bold" style="color:var(--chili)">${brl(p.price)}</span>

function toggleAddon(i){ modalState.addons[i]=!modalState.addons[i]; renderModal(); }
function changeQty(d){ modalState.qty=Math.max(1,modalState.qty+d); document.getElementById("modalQty").textContent=modalState.qty; updateModalTotal(); }
function updateModalTotal(){
  const p=modalState.product, addons=productAddons(p);
  let unit=p.price+addons.reduce((s,a,i)=>s+(modalState.addons[i]?a.p:0),0);
  document.getElementById("modalTotal").textContent=brl(unit*modalState.qty);
}
function addToCart(){
  const p=modalState.product, addons=productAddons(p).filter((a,i)=>modalState.addons[i]);
  const unit=p.price+addons.reduce((s,a)=>s+a.p,0);
  cart.push({uid:Date.now()+Math.random(), name:p.name, unit, qty:modalState.qty, addons, note:modalState.note});
  closeModal(); updateCartBadge(); openCart();
}

/* ===== Carrinho ===== */
function cartTotal(){ return cart.reduce((s,i)=>s+i.unit*i.qty,0); }
function cartCount(){ return cart.reduce((s,i)=>s+i.qty,0); }
function updateCartBadge(){
  const n=cartCount(); const badge=document.getElementById("cartBadge"); const bar=document.getElementById("floatBar");
  if(n>0){ badge.textContent=n; badge.classList.remove("hidden"); bar.classList.remove("hidden");
    document.getElementById("floatCount").textContent=n+(n===1?" item":" itens");
    document.getElementById("floatTotal").textContent=brl(cartTotal());
  } else { badge.classList.add("hidden"); bar.classList.add("hidden"); }
}
function openCart(){ drawerView="cart"; renderDrawer(); document.getElementById("cartBg").classList.remove("hidden"); setTimeout(()=>document.getElementById("cartDrawer").classList.remove("translate-x-full"),10); }
function closeCart(){ document.getElementById("cartDrawer").classList.add("translate-x-full"); setTimeout(()=>document.getElementById("cartBg").classList.add("hidden"),300); }
function qtyChange(uid,d){ const it=cart.find(i=>i.uid===uid); it.qty=Math.max(1,it.qty+d); renderDrawer(); updateCartBadge(); }
function removeItem(uid){ cart=cart.filter(i=>i.uid!==uid); renderDrawer(); updateCartBadge(); }

        <div><label class="font-semibold block mb-1">Ponto de referência</label><input id="fRef" value="${esc(o.referencia)}" oninput="order.referencia=this.value" class="w-full rounded-lg border px-3 py-2" placeholder="Próximo a..."></div>

    <button onclick="sendWhatsApp()" class="w-full mt-2 rounded-full py-3.5 font-bold text-white flex items-center justify-center gap-2 text-base" style="background:#25D366">📲 Enviar pedido pelo WhatsApp</button>`;

function sendWhatsApp(){
  let missing=[];
  if(!order.nome.trim()) missing.push("fNome");
  if(!order.telefone.trim()) missing.push("fTel");
  if(order.tipo==="entrega" && !order.endereco.trim()) missing.push("fEnd");
  document.querySelectorAll("#drawerBody input").forEach(el=>el.classList.remove("err"));
  if(missing.length){ missing.forEach(id=>{const el=document.getElementById(id); if(el) el.classList.add("err");}); document.getElementById(missing[0]).scrollIntoView({behavior:"smooth",block:"center"}); return; }
  let msg="🌮 NOVO PEDIDO\n";
  msg+=`Cliente: ${order.nome}\nTelefone: ${order.telefone}\nItens:\n`;
  cart.forEach(it=>{
    msg+=`${it.qty}x ${it.name} — ${brl(it.unit*it.qty)}\n`;
    if(it.addons.length) msg+=`   Adicionais: ${it.addons.map(a=>a.n).join(", ")}\n`;
    if(it.note) msg+=`   Obs: ${it.note}\n`;
  });
  if(order.obs.trim()) msg+=`Observação: ${order.obs}\n`;
  msg+=`Tipo: ${order.tipo==="entrega"?"Entrega":"Retirada"}\n`;
  if(order.tipo==="entrega") msg+=`Endereço: ${order.endereco}${order.referencia?" (Ref: "+order.referencia+")":""}\n`;
  msg+=`Pagamento: ${order.pagamento}\nTOTAL: ${brl(cartTotal())}`;
  window.open(`https://wa.me/${SITE.content.whatsappNumber}?text=${encodeURIComponent(msg)}`, "_blank");
}

/* ===== Persistência: publica a página inteira com os dados atuais ===== */
function buildFullHTML(){
  document.getElementById("modalBg").classList.add("hidden");
  document.getElementById("cartBg").classList.add("hidden");
  document.getElementById("cartDrawer").classList.add("translate-x-full");
  document.getElementById("adminBg").classList.add("hidden");
  document.getElementById("adminDrawer").classList.add("translate-x-full");
  cart=[]; drawerView="cart";
  if(!CATEGORIES.find(c=>c.id===activeCat)) activeCat = CATEGORIES[0]?CATEGORIES[0].id:"";
  renderContent(); renderNav(); renderGrid(); updateCartBadge();
  const appHTML = document.getElementById("app").innerHTML;
  const siteJSON = JSON.stringify(SITE).replace(/<\/script/gi, "<\\/script");
  return `<!doctype html>\n<html lang="pt-BR">\n${HEAD_HTML}\n<body>\n<div id="app">${appHTML}</div>\n<script id="siteData" type="application/json">${siteJSON}<\/script>\n<script>${SELF_SRC}<\/script>\n</body>\n</html>`;
}
async function persist(msg){
  if(!artifactCap){ toast("Publicação indisponível nesta visualização.", true); return false; }
  const full = buildFullHTML();
  try{
    sessionStorage.setItem("dv_toast", msg || "Salvo com sucesso!");
    await artifactCap.publish(full);
    toast(msg || "Salvo com sucesso!");
    return true;
  }catch(e){
    sessionStorage.removeItem("dv_toast");
    toast("Erro ao salvar. Tente novamente.", true);
    return false;
  }
}

/* --- Aba Cardápio: organizar, ativar/desativar, reordenar --- */
function tabCardapioHTML(){
  let html = `<button onclick="newProduct()" class="w-full mb-4 rounded-full py-2.5 font-semibold text-white" style="background:var(--chili)">+ Novo produto</button>`;
  if(!CATEGORIES.length){ html += `<div class="text-sm" style="color:var(--muted)">Crie uma categoria na aba 🏷️ Categorias antes de adicionar produtos.</div>`; return html; }
  CATEGORIES.forEach(c=>{
    const items = MENU.filter(p=>p.cat===c.id);
    html += `<div class="fd font-bold text-sm mt-4 mb-2">${c.icon} ${esc(c.name)}</div>`;
    if(!items.length) html += `<div class="text-xs mb-2" style="color:var(--muted)">Nenhum produto nesta categoria.</div>`;
    items.forEach((p,i)=>{
      html += `<div class="flex items-center gap-2 border rounded-xl px-3 py-2 mb-2" style="border-color:var(--border)">
        <div class="flex flex-col text-xs leading-none shrink-0">
          <button onclick="moveProduct('${p.id}',-1)" ${i===0?'disabled':''} class="disabled:opacity-20 py-0.5">▲</button>
          <button onclick="moveProduct('${p.id}',1)" ${i===items.length-1?'disabled':''} class="disabled:opacity-20 py-0.5">▼</button>
        </div>
        ${p.photo?`<img src="${p.photo}" class="w-9 h-9 object-cover rounded-lg shrink-0">`:`<span class="text-xl shrink-0">${p.img}</span>`}
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm truncate">${esc(p.name)}</div>
          <div class="text-xs" style="color:var(--muted)">${brl(p.price)}</div>
        </div>
        <label class="flex items-center gap-1 text-[10px] shrink-0"><input type="checkbox" ${p.available?'checked':''} onchange="toggleAvailable('${p.id}')">ativo</label>
        <button onclick="editProduct('${p.id}')" class="px-1 py-1 text-sm shrink-0">✏️</button>
        <button onclick="deleteProduct('${p.id}')" class="px-1 py-1 text-sm shrink-0">🗑️</button>
      </div>`;
    });
  });
  return html;
}
function toggleAvailable(id){ const p=MENU.find(x=>x.id===id); p.available=!p.available; renderGrid(); persist("Disponibilidade atualizada!"); renderAdminBody(); }
function moveProduct(id, dir){
  const p = MENU.find(x=>x.id===id);
  const sameCat = MENU.filter(x=>x.cat===p.cat);
  const idx = sameCat.indexOf(p), other = sameCat[idx+dir];
  if(!other) return;
  const gi=MENU.indexOf(p), gj=MENU.indexOf(other);
  [MENU[gi],MENU[gj]]=[MENU[gj],MENU[gi]];
  renderGrid(); persist("Ordem atualizada!"); renderAdminBody();
}
function deleteProduct(id){
  if(!confirm("Excluir este produto do cardápio? Essa ação não pode ser desfeita.")) return;
  MENU = MENU.filter(p=>p.id!==id); SITE.products = MENU;
  renderNav(); renderGrid(); persist("Produto excluído!"); renderAdminBody();
}

function newProduct(){ adminEditingId=null; setAdminTab("produtos"); }

function removePhoto(){ adminPhoto=null; renderPhotoPreview(); }
async function handlePhotoFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ alert("Selecione um arquivo de imagem."); return; }
  photoBusy = true; renderPhotoPreview();
  try{
    const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("Falha")); r.readAsDataURL(file); });
    const img = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("Falha")); im.src=dataUrl; });
    const maxW = 480, scale = Math.min(1, maxW/img.width);
    const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
    const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);
    adminPhoto = canvas.toDataURL("image/jpeg", 0.72);
  }catch(e){ alert("Não foi possível processar a foto. Tente outra imagem."); }
  photoBusy=false; renderPhotoPreview();
}
function renderAddonsList(){
  const el = document.getElementById("admAddonsList"); if(!el) return;
  el.innerHTML = adminAddons.length ? adminAddons.map((a,i)=>`
    <div class="flex items-center justify-between text-sm border border-[var(--border)] rounded-lg px-3 py-1.5">
      <span>${esc(a.n)} ${a.p>0?'('+brl(a.p)+')':'(grátis)'}</span>
      <button type="button" onclick="removeAdminAddon(${i})" class="text-xs font-semibold" style="color:var(--chili)">Remover</button>
    </div>`).join("") : `<div class="text-xs text-[var(--muted)]">Nenhum adicional cadastrado.</div>`;
}
function addAdminAddon(){
  const nameEl=document.getElementById("admAddonName"), priceEl=document.getElementById("admAddonPrice");
  const n=nameEl.value.trim(); const pr=parseFloat(priceEl.value);
  if(!n){ alert("Digite o nome do adicional."); return; }
  adminAddons.push({n, p:isNaN(pr)?0:pr});
  nameEl.value=""; priceEl.value=""; renderAddonsList();
}
function removeAdminAddon(i){ adminAddons.splice(i,1); renderAddonsList(); }
function saveProduct(){
  if(photoBusy){ alert("Aguarde o processamento da foto."); return; }
  const name=document.getElementById("admName").value.trim();
  const price=parseFloat(document.getElementById("admPrice").value);
  if(!name){ alert("Digite o nome do produto."); return; }
  if(isNaN(price) || price<0){ alert("Informe um preço válido."); return; }
  const cat=document.getElementById("admCat").value;
  if(!cat){ alert("Selecione uma categoria."); return; }
  const data = {
    name, desc:document.getElementById("admDesc").value.trim(), price, cat,
    badge:document.getElementById("admBadge").value.trim(), spec:document.getElementById("admSpec").value.trim(),
    img:adminEmoji, photo:adminPhoto, available:document.getElementById("admAvail").checked, addons:adminAddons.slice()
  };
  if(adminEditingId){ Object.assign(MENU.find(x=>x.id===adminEditingId), data); }
  else { const np=Object.assign({id:"p_"+Date.now()}, data); MENU.push(np); adminEditingId=np.id; }
  renderNav(); renderGrid();
  persist("Produto salvo com sucesso!");
  setAdminTab("cardapio");
}

/* --- Aba Categorias --- */
let catEditingId=null, catEmoji="🌮", catColor="var(--chili)";
const CAT_COLORS = ["var(--chili)","var(--avocado)","var(--marigold)","var(--clay)","var(--agave)"];
function tabCategoriasHTML(){
  let html = CATEGORIES.map((c,i)=>{
    const count = MENU.filter(p=>p.cat===c.id).length;
    return `<div class="flex items-center gap-2 border rounded-xl px-3 py-2 mb-2" style="border-color:var(--border)">
      <div class="flex flex-col text-xs leading-none shrink-0">
        <button onclick="moveCategory('${c.id}',-1)" ${i===0?'disabled':''} class="disabled:opacity-20 py-0.5">▲</button>
        <button onclick="moveCategory('${c.id}',1)" ${i===CATEGORIES.length-1?'disabled':''} class="disabled:opacity-20 py-0.5">▼</button>
      </div>
      <span class="text-xl shrink-0">${c.icon}</span>
      <div class="flex-1 text-sm font-semibold min-w-0 truncate">${esc(c.name)} <span class="text-xs font-normal" style="color:var(--muted)">(${count})</span></div>
      <button onclick="editCategory('${c.id}')" class="px-1 py-1 text-sm shrink-0">✏️</button>
      <button onclick="deleteCategory('${c.id}')" class="px-1 py-1 text-sm shrink-0">🗑️</button>
    </div>`;
  }).join("") || `<div class="text-sm mb-3" style="color:var(--muted)">Nenhuma categoria ainda.</div>`;
  const c = catEditingId ? CATEGORIES.find(x=>x.id===catEditingId) : null;
  catEmoji = c?c.icon:"🌮"; catColor = c?c.color:"var(--chili)";
  html += `<h3 class="fd font-bold text-base mt-5 mb-2">${catEditingId?"Editar categoria":"Nova categoria"}</h3>
    <div class="space-y-3 text-sm">
      <div><label class="font-semibold block mb-1">Nome</label><input id="catName" value="${c?esc(c.name):''}" class="w-full rounded-lg border px-3 py-2"></div>
      <div><label class="font-semibold block mb-1">Ícone</label><div class="flex flex-wrap gap-2">${EMOJI_OPTIONS.map(e=>`<button type="button" onclick="pickCatEmoji('${e}')" class="emo ${e===catEmoji?'sel':''}" data-catemo="${e}">${e}</button>`).join("")}</div></div>
      <div><label class="font-semibold block mb-1">Cor de destaque</label><div class="flex gap-2">${CAT_COLORS.map(cc=>`<button type="button" onclick="pickCatColor('${cc}')" class="w-8 h-8 rounded-full border-2" style="background:${cc};border-color:${cc===catColor?'var(--text)':'transparent'}"></button>`).join("")}</div></div>
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="saveCategory()" class="flex-1 rounded-full py-2.5 font-semibold" style="background:var(--avocado);color:var(--bg)">💾 Salvar categoria</button>
      ${catEditingId?`<button onclick="newCategory()" class="flex-1 rounded-full py-2.5 font-semibold border border-[var(--border)]">Cancelar</button>`:''}
    </div>`;
  return html;
}
function pickCatEmoji(e){ catEmoji=e; document.querySelectorAll(".emo[data-catemo]").forEach(b=>b.classList.toggle("sel", b.dataset.catemo===e)); }
function pickCatColor(c){ catColor=c; renderAdminBody(); }
function editCategory(id){ catEditingId=id; renderAdminBody(); }
function newCategory(){ catEditingId=null; renderAdminBody(); }
function saveCategory(){
  const name=document.getElementById("catName").value.trim();
  if(!name){ alert("Digite o nome da categoria."); return; }
  if(catEditingId){ const c=CATEGORIES.find(x=>x.id===catEditingId); c.name=name; c.icon=catEmoji; c.color=catColor; }
  else { const nc={id:"cat_"+Date.now(), name, icon:catEmoji, color:catColor}; CATEGORIES.push(nc); if(!activeCat) activeCat=nc.id; }
  catEditingId=null;
  renderNav(); renderGrid(); persist("Categoria salva com sucesso!"); renderAdminBody();
}
function moveCategory(id,dir){
  const idx=CATEGORIES.findIndex(c=>c.id===id), j=idx+dir;
  if(j<0||j>=CATEGORIES.length) return;
  [CATEGORIES[idx],CATEGORIES[j]]=[CATEGORIES[j],CATEGORIES[idx]];
  renderNav(); persist("Ordem das categorias atualizada!"); renderAdminBody();
}
function deleteCategory(id){
  const count = MENU.filter(p=>p.cat===id).length;
  if(count>0){ alert("Esta categoria tem "+count+" produto(s). Exclua ou edite esses produtos para outra categoria antes de remover esta."); return; }
  if(!confirm("Excluir esta categoria?")) return;
  CATEGORIES = CATEGORIES.filter(c=>c.id!==id); SITE.categories = CATEGORIES;
  if(activeCat===id) activeCat = CATEGORIES[0]?CATEGORIES[0].id:"";
  renderNav(); renderGrid(); persist("Categoria excluída!"); renderAdminBody();
}

  SITE.content.announcement = document.getElementById("cfgAnn").value.trim();
  syncWhatsappLinks(); renderAnnouncement();
  persist("Configurações salvas com sucesso!");
}
