<head>

<title>Dom Vilha Mexicano — Cardápio Digital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23dd5b31'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23fff'%3EDV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600;1,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--bg:#15110d;--surface:#1d1712;--text:#f3ead4;--muted:#c3b6a1;--border:#2b2119;
    --chili:#dd5b31;--avocado:#d9a94a;--marigold:#e0b563;--clay:#8a6a4a;--agave:#6b5847;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .fd{font-family:'Playfair Display',serif}
  .mono{font-family:'Space Mono',monospace}
  .eyebrow{font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.15em;font-size:.72rem;font-weight:700;color:var(--chili)}
  ::-webkit-scrollbar{height:6px;width:6px}
  .catbtn.active{background:var(--chili);color:#fff;border-color:var(--chili)}
  .drawer{transition:transform .3s ease}
  .modalbg{transition:opacity .2s ease}
  input,select,textarea{background:var(--surface);color:var(--text);border-color:var(--border)}
  input::placeholder,textarea::placeholder{color:var(--muted)}
  .err{border-color:var(--chili)!important}
  /* ===== Carrossel de fotos ===== */
  [hidden]{display:none!important}
  .car{position:relative;border-radius:1rem;overflow:hidden;border:1px solid var(--border);background:var(--surface);margin-bottom:1.5rem}
  .car-track{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;aspect-ratio:4/3;outline-offset:-3px}
  .car-track::-webkit-scrollbar{display:none}
  .car-slide{flex:0 0 100%;min-width:0;scroll-snap-align:center;scroll-snap-stop:always}
  .car-slide img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none}
  @media (min-width:640px){.car-track{aspect-ratio:16/9}}
  .car-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:9999px;border:1px solid rgba(243,234,212,.28);background:rgba(21,17,13,.62);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);transition:background .2s ease}
  .car-btn:hover{background:var(--chili)}
  .car-prev{left:.75rem}.car-next{right:.75rem}
  .car-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:.6rem;padding:1.1rem .75rem .7rem;background:linear-gradient(to top,rgba(21,17,13,.72),transparent);pointer-events:none}
  .car-bar>*{pointer-events:auto}
  .car-dot{position:relative;width:8px;height:8px;padding:0;border:0;border-radius:9999px;background:rgba(243,234,212,.5);cursor:pointer;transition:width .25s ease,background .25s ease}
  .car-dot::after{content:"";position:absolute;inset:-9px -3px}
  .car-dot[aria-current="true"]{width:22px;background:var(--marigold)}
  .car-pause{width:28px;height:28px;margin-left:.35rem;border-radius:9999px;border:1px solid rgba(243,234,212,.35);background:rgba(21,17,13,.55);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.car-dot{transition:none}}
  .adtab{font-family:'Space Mono',monospace;font-size:11px}
  /* o site só aparece depois de carregar o cardápio salvo (evita piscar preços antigos) */
  #app{opacity:0;transition:opacity .25s ease}
  #app.ready{opacity:1}
  @media (prefers-reduced-motion:reduce){#app{transition:none}}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
</style>
<noscript><style>#app{opacity:1}</style></noscript>
</head>
<body>
<div id="app">

<div id="announcementBar" class="hidden text-center text-sm font-semibold px-4 py-2" style="background:var(--chili);color:#fff"></div>

<header class="sticky top-0 z-30 bg-[var(--bg)]/95 backdrop-blur border-b border-[var(--border)]">

<section class="max-w-5xl mx-auto px-4 pt-8 pb-4 grid sm:grid-cols-2 gap-8 items-center">

<script>

/* ===== Helpers ===== */
const brl = v => "R$ " + Number(v||0).toFixed(2).replace(".", ",");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rich(s){ return esc(s).replace(/\*(.+?)\*/g,'<em class="italic" style="color:var(--marigold)">$1</em>'); }

/* Emojis não aparecem no site: são removidos de qualquer texto (dados antigos e o que for digitado no painel). */
const EMOJI_RE = /\p{Emoji_Presentation}|\p{Extended_Pictographic}\uFE0F|[\uFE0F\u200D\u20E3]/gu;
function noEmoji(s){
  if(typeof s !== "string") return s;
  const out = s.replace(EMOJI_RE, "");
  return out === s ? s : out.replace(/[ \t]{2,}/g, " ").trim();
}
function deepNoEmoji(v){
  if(typeof v === "string") return noEmoji(v);
  if(Array.isArray(v)) return v.map(deepNoEmoji);
  if(v && typeof v === "object"){ const o = {}; for(const k in v) o[k] = deepNoEmoji(v[k]); return o; }
  return v;
}
const fv = id => noEmoji(document.getElementById(id).value);              // lê um campo do painel já sem emoji
function monogram(p, size){ const ch = (p.name||"").trim().charAt(0).toUpperCase();
  return `<span class="fd font-extrabold select-none" aria-hidden="true" style="font-size:${size||"3rem"};line-height:1;opacity:.35">${esc(ch)}</span>`; }
const ADDONS_BURRITO = [{n:"Guacamole extra",p:4},{n:"Queijo extra",p:3},{n:"Dose extra de molho",p:3}];
function getAddons(cat){ return cat==="burritos"?ADDONS_BURRITO:[]; }

if(!Array.isArray(SITE.content.carousel)) SITE.content.carousel = [];

let cart = [];
let drawerView = "cart";
let order = {nome:"",telefone:"",tipo:"retirada",endereco:"",referencia:"",pagamento:"Pix",obs:""};

function renderTicket(){
  const el = document.getElementById("heroTicket"); if(!el) return;
  const picks=[], seen=new Set();
  for(const c of CATEGORIES){
    const item = MENU.find(p=>p.cat===c.id && p.available && !seen.has(p.id));
    if(item){ picks.push(item); seen.add(item.id); }
    if(picks.length>=4) break;
  }
  el.innerHTML = picks.length ? picks.map((p,i)=>`<div class="flex justify-between ${i<picks.length-1?'border-b border-dashed pb-1':''}" style="border-color:#00000022">${esc(p.name)} <span>${brl(p.price)}</span></div>`).join("")
    : '<div class="text-sm">Cardápio em breve...</div>';
}

/* ===== Toast ===== */
function toast(msg, isError){
  const el = document.getElementById("toastEl");
  if(!el) return;
  el.textContent = msg;
  el.style.background = isError ? "#c0392b" : "var(--avocado)";
  el.style.color = isError ? "#fff" : "var(--bg)";
  el.classList.remove("opacity-0","pointer-events-none");
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>{ el.classList.add("opacity-0","pointer-events-none"); }, 2800);
}

function renderGrid(){ document.getElementById("productGrid").innerHTML = gridHTML(); setupScrollSpy(); }
function scrollToCat(id){
  activeCat = id; renderNav();
  const el = document.getElementById("catsec-"+id);
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
let scrollSpyObserver = null;
function setupScrollSpy(){
  if(scrollSpyObserver) scrollSpyObserver.disconnect();
  const sections = Array.from(document.querySelectorAll("#productGrid section[data-cat]"));
  if(!sections.length) return;
  scrollSpyObserver = new IntersectionObserver((entries)=>{
    const visible = entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(visible.length){ const id = visible[0].target.dataset.cat; if(id!==activeCat){ activeCat=id; renderNav(); } }
  }, {rootMargin:"-160px 0px -70% 0px", threshold:0});
  sections.forEach(s=>scrollSpyObserver.observe(s));
}

function toggleAddon(i){ modalState.addons[i]=!modalState.addons[i]; renderModal(); }
function changeQty(d){ modalState.qty=Math.max(1,modalState.qty+d); document.getElementById("modalQty").textContent=modalState.qty; updateModalTotal(); }
function updateModalTotal(){
  const p=modalState.product, addons=productAddons(p);
  let unit=p.price+addons.reduce((s,a,i)=>s+(modalState.addons[i]?a.p:0),0);
  document.getElementById("modalTotal").textContent=brl(unit*modalState.qty);
}
function addToCart(){
  const p=modalState.product, addons=productAddons(p).filter((a,i)=>modalState.addons[i]);
  const unit=p.price+addons.reduce((s,a)=>s+a.p,0);
  cart.push({uid:Date.now()+Math.random(), name:p.name, unit, qty:modalState.qty, addons, note:modalState.note});
  closeModal(); updateCartBadge(); openCart();
}

/* ===== Carrinho ===== */
function cartTotal(){ return cart.reduce((s,i)=>s+i.unit*i.qty,0); }
function cartCount(){ return cart.reduce((s,i)=>s+i.qty,0); }
function updateCartBadge(){
  const n=cartCount(); const badge=document.getElementById("cartBadge"); const bar=document.getElementById("floatBar");
  if(n>0){ badge.textContent=n; badge.classList.remove("hidden"); bar.classList.remove("hidden");
    document.getElementById("floatCount").textContent=n+(n===1?" item":" itens");
    document.getElementById("floatTotal").textContent=brl(cartTotal());
  } else { badge.classList.add("hidden"); bar.classList.add("hidden"); }
}
function openCart(){ drawerView="cart"; renderDrawer(); document.getElementById("cartBg").classList.remove("hidden"); setTimeout(()=>document.getElementById("cartDrawer").classList.remove("translate-x-full"),10); }
function closeCart(){ document.getElementById("cartDrawer").classList.add("translate-x-full"); setTimeout(()=>document.getElementById("cartBg").classList.add("hidden"),300); }
function qtyChange(uid,d){ const it=cart.find(i=>i.uid===uid); it.qty=Math.max(1,it.qty+d); renderDrawer(); updateCartBadge(); }
function removeItem(uid){ cart=cart.filter(i=>i.uid!==uid); renderDrawer(); updateCartBadge(); }

  document.getElementById("drawerTitle").textContent = drawerView==="cart"?"Seu carrinho":"Finalizar pedido";

}

function sendWhatsApp(){
  let missing=[];
  if(!order.nome.trim()) missing.push("fNome");
  if(!order.telefone.trim()) missing.push("fTel");
  if(order.tipo==="entrega" && !order.endereco.trim()) missing.push("fEnd");
  document.querySelectorAll("#drawerBody input").forEach(el=>el.classList.remove("err"));
  if(missing.length){ missing.forEach(id=>{const el=document.getElementById(id); if(el) el.classList.add("err");}); document.getElementById(missing[0]).scrollIntoView({behavior:"smooth",block:"center"}); return; }
  let msg="NOVO PEDIDO\n";
  msg+=`Cliente: ${order.nome}\nTelefone: ${order.telefone}\nItens:\n`;
  cart.forEach(it=>{
    msg+=`${it.qty}x ${it.name} — ${brl(it.unit*it.qty)}\n`;
    if(it.addons.length) msg+=`   Adicionais: ${it.addons.map(a=>a.n).join(", ")}\n`;
    if(it.note) msg+=`   Obs: ${it.note}\n`;
  });
  if(order.obs.trim()) msg+=`Observação: ${order.obs}\n`;
  msg+=`Tipo: ${order.tipo==="entrega"?"Entrega":"Retirada"}\n`;
  if(order.tipo==="entrega") msg+=`Endereço: ${order.endereco}${order.referencia?" (Ref: "+order.referencia+")":""}\n`;
  msg+=`Pagamento: ${order.pagamento}\nTOTAL: ${brl(cartTotal())}`;
  window.open(`https://wa.me/${SITE.content.whatsappNumber}?text=${encodeURIComponent(msg)}`, "_blank");
}

/* ===== Autenticação do administrador ===== */
const TOKEN_KEY = "dv_admin_token";
let adminToken = null, pendingSave = null;
function loadToken(){
  try{
    const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
    if(t && t.token && t.exp > Date.now()) adminToken = t.token; else localStorage.removeItem(TOKEN_KEY);
  }catch(e){}
}
function setToken(token, exp){
  adminToken = token;
  try{ localStorage.setItem(TOKEN_KEY, JSON.stringify({token, exp})); }catch(e){}
  refreshAdminUI();
}
function clearToken(){
  adminToken = null;
  try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  refreshAdminUI();
}
function refreshAdminUI(){ document.getElementById("adminBtn").classList.toggle("hidden", !adminToken); }
function authHeaders(){ return {"Content-Type":"application/json", "Authorization":"Bearer " + adminToken}; }
function adminEntry(){ if(adminToken) openAdmin(); else openLogin(); }
function logoutAdmin(){ closeAdmin(); clearToken(); toast("Você saiu do painel."); }

function openLogin(){
  document.getElementById("loginError").textContent = "";
  document.getElementById("loginPass").value = "";
  document.getElementById("loginBg").classList.remove("hidden");
  setTimeout(()=>document.getElementById("loginPass").focus(), 50);
}
function closeLogin(){ document.getElementById("loginBg").classList.add("hidden"); }
async function submitLogin(){
  const err = document.getElementById("loginError"), btn = document.getElementById("loginBtn");
  const password = document.getElementById("loginPass").value;
  if(!password){ err.textContent = "Digite a senha."; return; }
  btn.disabled = true; btn.textContent = "Entrando...";
  try{
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ err.textContent = j.error || "Não foi possível entrar."; return; }
    setToken(j.token, j.exp);
    closeLogin();
    if(pendingSave){ const m = pendingSave; pendingSave = null; persist(m); }  // retoma o que ficou sem salvar
    else openAdmin();
  }catch(e){
    err.textContent = "Sem conexão. Verifique a internet e tente de novo.";
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
}
function handleHash(){
  if(location.hash === "#admin"){
    history.replaceState(null, "", location.pathname + location.search);
    adminEntry();
  }
}
window.addEventListener("hashchange", handleHash);

/* ===== Persistência: envia o cardápio para o servidor (/api/menu) ===== */
let saveChain = Promise.resolve();
function persist(msg){
  // fila: salvamentos seguidos (ex.: ativar/desativar vários produtos) nunca se atropelam
  saveChain = saveChain.then(()=>doSave(msg)).catch(()=>false);
  return saveChain;
}
async function doSave(msg){
  if(!adminToken){ pendingSave = msg; toast("Entre como administrador para salvar.", true); openLogin(); return false; }
  try{
    const r = await fetch("/api/menu", {method:"PUT", headers:authHeaders(), body:JSON.stringify(SITE)});
    const j = await r.json().catch(()=>({}));
    if(r.status === 401){ clearToken(); pendingSave = msg; toast("Sessão expirada. Entre novamente.", true); openLogin(); return false; }
    if(!r.ok){ toast(j.error || "Erro ao salvar. Tente novamente.", true); return false; }
    toast(msg || "Salvo com sucesso!");
    return true;
  }catch(e){
    toast("Erro ao salvar. Verifique a conexão e tente novamente.", true);
    return false;
  }
}

/* ===== Carregamento do cardápio salvo ===== */
function applySite(data){
  data = deepNoEmoji(data);
  SITE = {content: Object.assign({}, DEFAULT_CONTENT, data.content), categories: data.categories, products: data.products};
  if(!SITE.content.features) SITE.content.features = [];
  SITE.content.carousel = Array.isArray(data.content.carousel) ? data.content.carousel.slice() : [];
  MENU = SITE.products; CATEGORIES = SITE.categories;
  activeCat = CATEGORIES[0] ? CATEGORIES[0].id : "";
}
async function loadRemote(){
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 4000);
  try{
    const r = await fetch("/api/menu", {signal: ctl.signal});
    if(!r.ok) return;
    const j = await r.json();
    const d = j && j.data;
    if(d && d.content && Array.isArray(d.categories) && Array.isArray(d.products)) applySite(d);

  finally{ clearTimeout(timer); }
}

/* Reduz a imagem no navegador e envia para o servidor. Devolve a URL pública. */
async function uploadImageFile(file, maxSide, quality){
  if(!file.type.startsWith("image/")) throw new Error("Selecione um arquivo de imagem.");
  if(!adminToken){ openLogin(); throw new Error("Entre como administrador para enviar fotos."); }
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("Falha")); r.readAsDataURL(file); });
  const img = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("Falha")); im.src=dataUrl; });
  const scale = Math.min(1, maxSide/Math.max(img.width, img.height));
  const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
  const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
  canvas.getContext("2d").drawImage(img,0,0,w,h);
  const r = await fetch("/api/upload", {method:"POST", headers:authHeaders(), body:JSON.stringify({image: canvas.toDataURL("image/jpeg", quality)})});
  const j = await r.json().catch(()=>({}));
  if(r.status === 401){ clearToken(); openLogin(); throw new Error("Sessão expirada. Entre novamente e envie a foto de novo."); }
  if(!r.ok) throw new Error(j.error || "Falha no envio.");
  return j.url;
}
const uploadErrorText = e => (e && e.message && e.message !== "Falha") ? e.message : "Não foi possível enviar a foto. Tente outra imagem.";

async function handlePhotoFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  photoBusy = true; renderPhotoPreview();
  try{ adminPhoto = await uploadImageFile(file, 800, 0.8); }
  catch(e){ alert(uploadErrorText(e)); }
  input.value = "";
  photoBusy=false; renderPhotoPreview();
}

/* ===== Carrossel de fotos (seção "Da chapa até a sua mesa") ===== */
const CAR_MAX = 12, CAR_INTERVAL = 5500;
const CAR = {idx:0, n:0, timer:null, raf:0, hover:false, resumeAt:0, userPaused:false, target:null, targetUntil:0,
             reduced: !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)};
const CAR_ICON = {
  prev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  pause:'<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="3" height="10" rx="1"/><rect x="7" y="1" width="3" height="10" rx="1"/></svg>',
  play:'<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M3 1.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L3.9.7a.6.6 0 0 0-.9.5z"/></svg>'
};
function carItems(){ return (SITE.content.carousel||[]).filter(x=>x && x.url); }
function carTrack(){ return document.getElementById("carTrack"); }

function renderCarousel(){
  const box = document.getElementById("carousel"); if(!box) return;
  clearInterval(CAR.timer); CAR.timer = null;
  const items = carItems();
  CAR.n = items.length; CAR.idx = 0; CAR.hover = false; CAR.resumeAt = 0; CAR.target = null;
  if(!items.length){ box.hidden = true; box.innerHTML = ""; return; }
  const multi = items.length > 1;
  box.hidden = false;
  box.innerHTML = `
    <div id="carTrack" class="car-track" tabindex="0" onkeydown="carKey(event)" aria-label="Fotos, use as setas para navegar">
      ${items.map((it,i)=>`<div class="car-slide" role="group" aria-roledescription="slide" aria-label="${i+1} de ${items.length}">
        <img src="${esc(it.url)}" alt="${esc(it.alt || ("Foto "+(i+1)+" de "+items.length))}" ${i===0?"":'loading="lazy"'} decoding="async" draggable="false" onerror="this.style.visibility='hidden'">
      </div>`).join("")}
    </div>
    ${multi?`
    <button type="button" class="car-btn car-prev" onclick="carStep(-1)" aria-label="Foto anterior">${CAR_ICON.prev}</button>
    <button type="button" class="car-btn car-next" onclick="carStep(1)" aria-label="Próxima foto">${CAR_ICON.next}</button>
    <div class="car-bar">
      ${items.map((_,i)=>`<button type="button" class="car-dot" onclick="carStep(0,${i})" aria-label="Ir para a foto ${i+1}" ${i===0?'aria-current="true"':''}></button>`).join("")}
      ${CAR.reduced?"":`<button type="button" id="carPause" class="car-pause" onclick="carTogglePause()" aria-label="Pausar a troca automática de fotos">${CAR_ICON.pause}</button>`}
    </div>`:""}`;
  if(!multi) return;
  const t = carTrack();
  t.addEventListener("scroll", ()=>{
    cancelAnimationFrame(CAR.raf);
    CAR.raf = requestAnimationFrame(()=>{
      if(CAR.target !== null){   // durante a animação até a foto escolhida, não deixa os pontos "piscarem" de volta
        const arrived = Math.abs(t.scrollLeft - CAR.target * t.clientWidth) < 2;
        if(!arrived && Date.now() < CAR.targetUntil) return;
        CAR.target = null;
      }
      const i = Math.round(t.scrollLeft / Math.max(1, t.clientWidth));
      if(i !== CAR.idx){ CAR.idx = i; carSyncDots(); }
    });
  }, {passive:true});
  const bump = ()=>{ CAR.resumeAt = Date.now() + 9000; CAR.target = null; };   // depois de qualquer toque/clique, espera antes de voltar a rodar
  box.onmouseenter = ()=>{ CAR.hover = true; };
  box.onmouseleave = ()=>{ CAR.hover = false; };
  box.onfocusin = ()=>{ CAR.hover = true; };
  box.onfocusout = ()=>{ CAR.hover = false; };
  box.ontouchstart = bump; box.onpointerdown = bump;
  carStart();
}
function carSyncDots(){
  document.querySelectorAll("#carousel .car-dot").forEach((d,i)=>{ if(i===CAR.idx) d.setAttribute("aria-current","true"); else d.removeAttribute("aria-current"); });
}
function carGo(i){
  const t = carTrack(); if(!t || CAR.n < 2) return;
  i = (i + CAR.n) % CAR.n;
  CAR.target = i; CAR.targetUntil = Date.now() + 900;
  t.scrollTo({left: i * t.clientWidth, behavior: CAR.reduced ? "auto" : "smooth"});
  CAR.idx = i; carSyncDots();
}
function carStep(delta, absolute){
  CAR.resumeAt = Date.now() + 9000;
  carGo(typeof absolute === "number" ? absolute : CAR.idx + delta);
}
function carKey(e){
  if(e.key === "ArrowRight"){ e.preventDefault(); carStep(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); carStep(-1); }
}
function carStart(){
  clearInterval(CAR.timer); CAR.timer = null;
  if(CAR.reduced || CAR.n < 2 || CAR.userPaused) return;   // respeita "reduzir movimento" e o botão de pausa
  CAR.timer = setInterval(()=>{
    if(document.hidden || CAR.hover || Date.now() < CAR.resumeAt) return;
    carGo(CAR.idx + 1);
  }, CAR_INTERVAL);
}
function carTogglePause(){
  CAR.userPaused = !CAR.userPaused;
  const b = document.getElementById("carPause");
  if(b){
    b.innerHTML = CAR.userPaused ? CAR_ICON.play : CAR_ICON.pause;
    b.setAttribute("aria-label", CAR.userPaused ? "Retomar a troca automática de fotos" : "Pausar a troca automática de fotos");
  }
  carStart();
}
window.addEventListener("resize", ()=>{ const t = carTrack(); if(t) t.scrollLeft = CAR.idx * t.clientWidth; });

/* --- Painel: aba Carrossel --- */
let carBusy = false;
function tabCarrosselHTML(){
  return `
    <div class="text-xs mb-3" style="color:var(--muted)">Fotos que passam em destaque na seção "${esc(noMarks(SITE.content.featuresTitle))}". Até ${CAR_MAX} fotos; prefira imagens na horizontal. Sem fotos, o carrossel não aparece no site.</div>
    <label class="inline-block rounded-lg border border-[var(--border)] px-3 py-2 text-sm font-semibold cursor-pointer">
      Adicionar fotos
      <input id="carFile" type="file" accept="image/*" multiple class="hidden" onchange="handleCarouselFiles(this)">
    </label>
    <div id="carStatus" class="text-xs mt-2 min-h-[1rem]" style="color:var(--muted)" role="status"></div>
    <div id="carAdminList" class="mt-3 space-y-2"></div>
    <button onclick="saveCarousel()" class="w-full mt-4 rounded-full py-3 font-bold" style="background:var(--avocado);color:var(--bg)">Salvar carrossel</button>`;
}
const noMarks = t => String(t||"").replace(/\*/g,"");
function renderCarAdminList(){
  const el = document.getElementById("carAdminList"); if(!el) return;
  const list = SITE.content.carousel;
  el.innerHTML = list.length ? list.map((it,i)=>`
    <div class="flex items-center gap-2 border rounded-xl p-2" style="border-color:var(--border)">
      <div class="flex flex-col text-xs leading-none shrink-0">
        <button type="button" onclick="moveCarPhoto(${i},-1)" ${i===0?"disabled":""} class="disabled:opacity-20 py-0.5" aria-label="Mover foto ${i+1} para cima">▲</button>
        <button type="button" onclick="moveCarPhoto(${i},1)" ${i===list.length-1?"disabled":""} class="disabled:opacity-20 py-0.5" aria-label="Mover foto ${i+1} para baixo">▼</button>
      </div>
      <img src="${esc(it.url)}" alt="" class="w-16 h-12 object-cover rounded-lg shrink-0">
      <input value="${esc(it.alt||"")}" onchange="updateCarAlt(${i},this.value)" maxlength="200" placeholder="Descrição da foto (opcional)" aria-label="Descrição da foto ${i+1}" class="flex-1 min-w-0 rounded border px-2 py-1 text-xs">
      <button type="button" onclick="removeCarPhoto(${i})" class="px-2 py-1 text-xs font-semibold underline shrink-0" style="color:var(--chili)">Remover</button>
    </div>`).join("") : `<div class="text-xs" style="color:var(--muted)">Nenhuma foto ainda.</div>`;
}
function carSetStatus(msg, isError){
  const el = document.getElementById("carStatus"); if(!el) return;
  el.textContent = msg; el.style.color = isError ? "#ff8a70" : "var(--muted)";
}
async function handleCarouselFiles(input){
  let files = Array.from(input.files || []); input.value = "";
  if(!files.length || carBusy) return;
  const list = SITE.content.carousel;
  const room = CAR_MAX - list.length;
  if(room <= 0){ carSetStatus("Limite de " + CAR_MAX + " fotos atingido. Remova alguma para adicionar outra.", true); return; }
  const skipped = Math.max(0, files.length - room);
  files = files.slice(0, room);
  carBusy = true;
  let ok = 0; const errors = [];
  for(let k=0; k<files.length; k++){
    carSetStatus("Enviando foto " + (k+1) + " de " + files.length + "...");
    try{
      const url = await uploadImageFile(files[k], 1600, 0.82);
      list.push({url, alt:""}); ok++;
      renderCarAdminList(); renderCarousel();
    }catch(e){ errors.push(files[k].name + ": " + uploadErrorText(e)); if(!adminToken) break; }
  }
  carBusy = false;
  let msg = ok ? (ok + (ok===1?" foto adicionada":" fotos adicionadas") + ". Clique em Salvar carrossel.") : "";
  if(skipped) msg += " " + skipped + " ficou de fora (limite de " + CAR_MAX + ").";
  if(errors.length) msg += " Falhou: " + errors.join(" | ");
  carSetStatus(msg.trim(), errors.length > 0 && !ok);
}
function moveCarPhoto(i, dir){
  const list = SITE.content.carousel, j = i + dir;
  if(j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  renderCarAdminList(); renderCarousel();
}
function removeCarPhoto(i){
  if(!confirm("Remover esta foto do carrossel?")) return;
  SITE.content.carousel.splice(i, 1);
  renderCarAdminList(); renderCarousel();
}
function updateCarAlt(i, val){ SITE.content.carousel[i].alt = noEmoji(val).trim(); renderCarousel(); }
function saveCarousel(){ persist("Carrossel salvo com sucesso!"); }

/* --- Aba Configurações --- */
function tabConfigHTML(){
  const c = SITE.content;
  return `
    <div class="eyebrow mb-2">WHATSAPP</div>
    <div class="mb-3"><label class="font-semibold block mb-1 text-sm">Número (DDI+DDD+número, só dígitos)</label><input id="cfgWa" value="${esc(c.whatsappNumber)}" placeholder="5567999999999" class="w-full rounded-lg border px-3 py-2 text-sm"></div>
    <div class="eyebrow mb-2 mt-4">AVISO / PROMOÇÃO</div>
    <div class="mb-3"><label class="font-semibold block mb-1 text-sm">Faixa de aviso no topo do site (vazio = oculto)</label><textarea id="cfgAnn" rows="2" class="w-full rounded-lg border px-3 py-2 text-sm" placeholder="Ex: Hoje o delivery é grátis acima de R$ 50!">${esc(c.announcement||"")}</textarea></div>
    <button onclick="saveConfig()" class="w-full mt-2 rounded-full py-3 font-bold" style="background:var(--avocado);color:var(--bg)">Salvar configurações</button>`;
}
function saveConfig(){
  const num = document.getElementById("cfgWa").value.replace(/\D/g,"");
  if(num.length<10 || num.length>14){ alert("Digite um número de WhatsApp válido (com DDI e DDD, só números)."); return; }
  SITE.content.whatsappNumber = num;
  SITE.content.announcement = fv("cfgAnn").trim();
  syncWhatsappLinks(); renderAnnouncement();
  persist("Configurações salvas com sucesso!");
}

/* ===== INIT ===== */
loadToken();
refreshAdminUI();
(async function boot(){
  const app = document.getElementById("app");
  const failsafe = setTimeout(()=>app.classList.add("ready"), 5000);
  try{
    await loadRemote();
    renderContent(); renderNav(); renderGrid(); updateCartBadge(); syncWhatsappLinks();
  }finally{
    clearTimeout(failsafe);
    app.classList.add("ready");
  }
  handleHash();
})();
</script>
</body>
</html>
